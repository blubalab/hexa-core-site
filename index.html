<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexa Core: Awakening</title>
<meta name="description" content="Hexa Core: Awakening is a new game by Blubalab, coming soon to Google Play.">
<link rel="canonical" href="https://hexa-core.blubalab.com/">
<link rel="icon" href="img/icon.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:title" content="Hexa Core: Awakening">
<meta property="og:description" content="Coming soon to Google Play.">
<meta property="og:url" content="https://hexa-core.blubalab.com/">
<meta property="og:image" content="https://hexa-core.blubalab.com/img/banner.webp">
<meta name="theme-color" content="#0b0e1a">
<style>
  :root {
    --bg: #0b0e1a;
    --text: #e7eaf5;
    --dim: #565e80;
    --accent: #6fd0ff;
    --amber: #ffc76a;
    --panel-border: #2a3158;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  main img {
    width: 100%;
    max-width: 640px;
    height: auto;
    border-radius: 18px;
  }
  .tagline {
    font-size: 1.15rem;
    margin: 0.9em 0 0;
  }
  .soon {
    display: inline-block;
    margin-top: 1.2em;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    border: 1px solid rgba(255, 199, 106, 0.4);
    border-radius: 999px;
    padding: 6px 16px;
  }
  footer {
    text-align: center;
    padding: 24px 24px 40px;
    color: var(--dim);
    font-size: 0.85rem;
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
  footer .sep { margin: 0 0.6em; color: var(--panel-border); }
</style>
</head>
<body>

<main>
  <img src="img/banner.webp" alt="Hexa Core: Awakening">
  <p class="tagline">Clear the fog, connect the machines, wake the Core.</p>
  <span class="soon">Coming soon to Google Play</span>
</main>

<footer>
  <a href="/privacy/">Privacy Policy</a>
  <span class="sep">&middot;</span>
  <a href="https://blubalab.com/">Blubalab</a>
  <span class="sep">&middot;</span>
  &copy; 2026 Blubalab
</footer>

</body>
</html>
